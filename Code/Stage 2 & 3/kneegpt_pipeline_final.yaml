project:
  name: KneeGPT_MIUA_final
  root_dir: .
  seed: 42
  device: cuda

paths:
  train_csv: ./train_with_bmi.csv
  val_csv: ./val_with_bmi.csv
  test_csv: ./test_with_bmi.csv

scripts:
  stage1: ./stage1_pretrain_kl_v1.py
  stage2: ./stage2_train_binary_v1.py
  stage3: ./stage3_kneegpt_reliability_v1.py

metadata:
  use_metadata_options: [false, true]
  age_group_col: AGE_GROUP_CODE
  bmi_col: BMI
  sex_col: SEX_MALE

backbones:
  - alias: clip
    name: openai/clip-vit-base-patch32
  - alias: dino
    name: facebook/dinov2-base



stage2:
  enabled: false
  out_root: ./outputs/stage2
  binary_threshold: 2
  train_modes: [frozen, finetuned]
  train_fractions: [0.2, 0.5, 1.0]
  init_from_stage1_options: [false]
  epochs: 20
  batch_size: 16
  num_workers: 4
  head_lr: 1.0e-4
  encoder_lr: 1.0e-5
  weight_decay: 1.0e-4
  dropout: 0.2
  label_smoothing: 0.02
  early_stopping_patience: 4
  summary_filename: all_stage2_runs_summary.csv
  selection_metric: best_val_macro_f1
  primary_metric_direction: max

stage3:
  enabled: true
  out_root: ./outputs/stage3
  run_for_best_per_group: true
  best_groups:
    - metadata_mode
  group_labels:
    false: image_only
    true: with_metadata
  select_from_stage2_metric: best_val_macro_f1
  select_direction: max
  mc_runs: 20
  bootstrap_iters: 1000
  embedding_method: umap
  style:
    palette: purple_navy
    primary_hex: '#058EEF'
    secondary_hex: '#E37405'

outputs:
  master_dir: ./outputs
  save_master_summary: true
  save_best_model_index: true
  master_summary_filename: master_pipeline_summary.csv
  best_models_filename: best_models_for_stage3.csv